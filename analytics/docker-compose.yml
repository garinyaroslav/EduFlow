services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: eduflow-clickhouse
    environment:
      CLICKHOUSE_USER: eduflow
      CLICKHOUSE_PASSWORD: eduflow
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:latest
    container_name: eduflow-grafana
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  spark:
    image: apache/spark:3.5.3
    container_name: eduflow-spark
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_USER: eduflow
      CLICKHOUSE_PASSWORD: eduflow
      CLICKHOUSE_DB: eduflow
      CLICKHOUSE_JDBC_JAR: /opt/eduflow/jars/clickhouse-jdbc-0.6.0-all.jar
      RISK_INACTIVE_DAYS: "21"
      PATH: /opt/spark/bin:/usr/bin:/bin
    volumes:
      - ./processing:/opt/eduflow
    working_dir: /opt/eduflow
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command: ["sleep infinity"]

volumes:
  clickhouse-data:
  grafana-data:
