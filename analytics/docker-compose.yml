services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: eduflow-clickhouse
    environment:
      CLICKHOUSE_USER: eduflow
      CLICKHOUSE_PASSWORD: eduflow
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123" # HTTP
      - "9000:9000" # native
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:latest
    container_name: eduflow-grafana
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  # Одноразовый / по требованию Spark-воркер.
  # Запуск джобы:
  #   docker compose run --rm spark /opt/eduflow/run.sh
  spark:
    image: apache/spark:latest
    container_name: eduflow-spark
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_USER: eduflow
      CLICKHOUSE_PASSWORD: eduflow
      CLICKHOUSE_DB: eduflow
      RISK_INACTIVE_DAYS: "21"
    volumes:
      - ./processing:/opt/eduflow:ro
      - ./processing/jars:/opt/spark/jars-extra:ro
    working_dir: /opt/eduflow
    entrypoint: ["/bin/bash", "-c"]
    command: ["sleep infinity"]
    user: root

volumes:
  clickhouse-data:
  grafana-data:
